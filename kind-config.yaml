apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
# Enable the Container Checkpointing feature gate on API Server and Controller Manager
featureGates:
  ContainerCheckpoint: true
# Explicitly patch KubeletConfiguration to guarantee Kubelet enables the ContainerCheckpoint feature gate
kubeadmConfigPatches:
  - |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    featureGates:
      ContainerCheckpoint: true
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /tmp/checkpoints
        containerPath: /var/lib/kubelet/checkpoints
  # Node dedicated to Default Kubernetes Scheduler deployment
  - role: worker
    labels:
      benchmark.role: default
    extraMounts:
      - hostPath: /tmp/checkpoints
        containerPath: /var/lib/kubelet/checkpoints
  # Node dedicated to Adaptive Kubernetes Scheduler deployment (with CRIU checkpoints)
  - role: worker
    labels:
      benchmark.role: adaptive
    extraMounts:
      - hostPath: /tmp/checkpoints
        containerPath: /var/lib/kubelet/checkpoints
