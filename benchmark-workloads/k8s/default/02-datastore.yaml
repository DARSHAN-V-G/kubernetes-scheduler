apiVersion: v1
kind: Service
metadata:
  name: datastore
  namespace: test-application-default
  labels:
    app: datastore
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: datastore
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastore
  namespace: test-application-default
  labels:
    app: datastore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datastore
  template:
    metadata:
      labels:
        app: datastore
    spec:
      nodeSelector:
        benchmark.role: default
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "shared_buffers=16MB"
            - "-c"
            - "max_connections=30"
          env:
            - name: POSTGRES_DB
              value: "benchmark_fleet"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: postgres-password
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: "40m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}
