apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: test-application-default
  labels:
    app: core-api
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: core-api
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: test-application-default
  labels:
    app: core-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      nodeSelector:
        benchmark.role: default
      containers:
        - name: core-api
          image: benchmark-core-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fleet-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fleet-secrets
                  key: postgres-password
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
