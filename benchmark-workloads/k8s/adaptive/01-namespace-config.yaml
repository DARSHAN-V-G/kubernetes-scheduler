apiVersion: v1
kind: Namespace
metadata:
  name: test-application-adaptive
  labels:
    benchmark.role: adaptive-scheduler
    app.kubernetes.io/name: benchmark-fleet
---
apiVersion: v1
kind: Secret
metadata:
  name: fleet-secrets
  namespace: test-application-adaptive
type: Opaque
stringData:
  postgres-password: "benchmark_secure_pass"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-config
  namespace: test-application-adaptive
data:
  DB_HOST: "datastore"
  DB_PORT: "5432"
  DB_USER: "postgres"
  DB_NAME: "benchmark_fleet"
  REDIS_ADDR: "cache:6379"
