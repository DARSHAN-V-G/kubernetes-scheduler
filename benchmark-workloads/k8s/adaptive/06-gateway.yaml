apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx-conf
  namespace: test-application-adaptive
data:
  nginx.conf: |
    worker_processes 1;
    events {
        worker_connections 512;
    }
    http {
        include       /etc/nginx/mime.types;
        default_type  application/json;
        sendfile        on;
        keepalive_timeout 65;

        upstream activator_backend {
            server adaptive-scheduler.adaptive-scheduler.svc.cluster.local:8083;
            keepalive 16;
        }

        server {
            listen 80;
            server_name localhost;

            # Health check probe for Kubernetes
            location /healthz {
                access_log off;
                return 200 '{"status":"ok","component":"gateway"}\n';
            }

            # Status and metrics endpoint
            location /nginx_status {
                stub_status on;
                access_log off;
            }

            # Proxy all /api/v1/ requests through Demand Activator
            location /api/v1/ {
                proxy_pass http://activator_backend;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Target-Service test-application-adaptive/core-api:3000;
                
                # Demand Activator buffering tolerance (allow up to 25s for cold scale-from-zero)
                proxy_connect_timeout 25s;
                proxy_read_timeout 35s;
                proxy_send_timeout 35s;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: test-application-adaptive
  labels:
    app: gateway
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: gateway
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: test-application-adaptive
  labels:
    app: gateway
    scheduler.reclaim/class: "A"
  annotations:
    reclaim.io/app: "benchmark-fleet"
    reclaim.io/checkpointable: "false"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        scheduler.reclaim/class: "A"
      annotations:
        reclaim.io/app: "benchmark-fleet"
        reclaim.io/checkpointable: "false"
    spec:
      schedulerName: adaptive-scheduler
      nodeSelector:
        benchmark.role: adaptive
      containers:
        - name: gateway
          image: benchmark-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "64Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: gateway-nginx-conf
