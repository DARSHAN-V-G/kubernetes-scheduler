# Nginx Configuration for Benchmark Gateway
worker_processes 1;
events {
    worker_connections 512;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout 65;

    upstream core_backend {
        server core-api:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check probe for Kubernetes
        location /healthz {
            access_log off;
            return 200 '{"status":"ok","component":"gateway"}\n';
        }

        # Status and metrics endpoint
        location /nginx_status {
            stub_status on;
            access_log off;
        }

        # Proxy all /api/v1/ requests to Core API
        location /api/v1/ {
            proxy_pass http://core_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Demand Activator buffering tolerance (allow up to 25s for cold scale-from-zero)
            proxy_connect_timeout 25s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
