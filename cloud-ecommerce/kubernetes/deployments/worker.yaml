apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ecommerce
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        scheduler.reclaim/class: "A"
    spec:
      containers:
        - name: worker
          image: worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "worker"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          # Since it is a stateless worker, we use a simple liveness probe checking the process status
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - worker.js
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 15
