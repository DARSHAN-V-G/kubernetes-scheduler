apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ecommerce
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        scheduler.reclaim/class: "A"
    spec:
      containers:
        - name: worker
          image: worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "worker"
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - worker.js
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
