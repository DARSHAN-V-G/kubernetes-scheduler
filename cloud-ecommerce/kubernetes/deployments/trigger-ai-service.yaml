apiVersion: v1
kind: Service
metadata:
  name: trigger-ai-service
  namespace: ecommerce
  labels:
    app: trigger-ai-service
spec:
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: trigger-ai-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trigger-ai-service
  namespace: ecommerce
  labels:
    app: trigger-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trigger-ai-service
  template:
    metadata:
      labels:
        app: trigger-ai-service
    spec:
      schedulerName: adaptive-scheduler
      containers:
        - name: trigger-ai-service
          image: node:18-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const http = require('http');
              const s = http.createServer((req, res) => {
                res.writeHead(200, {'Content-Type': 'application/json'});
                res.end(JSON.stringify({ message: "AI Recommendations Generated (Mock)" }));
              });
              s.listen(3000, () => console.log('Mock AI service listening on port 3000'));
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 15
