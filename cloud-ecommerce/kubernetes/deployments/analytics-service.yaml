apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: ecommerce
  labels:
    app: analytics-service
spec:
  replicas: 4
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        scheduler.reclaim/class: "A"
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "analytics-service"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          resources:
            requests:
              cpu: "2"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - analytics.js
            initialDelaySeconds: 20
            periodSeconds: 15
