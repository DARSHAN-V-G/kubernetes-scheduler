apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: ecommerce
  labels:
    app: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        scheduler.reclaim/class: "A"
    spec:
      containers:
        - name: analytics-service
          image: analytics-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: "analytics-service"
            - name: REDIS_URL
              value: "redis://redis:6379"
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - analytics.js
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
