apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: ecommerce
data:
  db-init.sql: |
    -- Create Users Table for User Service
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        username VARCHAR(50) UNIQUE NOT NULL,
        email VARCHAR(100) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create Products Table
    CREATE TABLE IF NOT EXISTS products (
        id VARCHAR(50) PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        price DECIMAL(10, 2) NOT NULL,
        category VARCHAR(100),
        description TEXT,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create Orders Table for Order Service
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        user_id INT NOT NULL,
        total_amount DECIMAL(10, 2) NOT NULL,
        status VARCHAR(50) DEFAULT 'Pending',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    -- Create Order Items Table
    CREATE TABLE IF NOT EXISTS order_items (
        id SERIAL PRIMARY KEY,
        order_id INT REFERENCES orders(id) ON DELETE CASCADE,
        product_id VARCHAR(50) NOT NULL,
        quantity INT NOT NULL,
        price DECIMAL(10, 2) NOT NULL
    );

    -- Insert dummy users for initial testing
    INSERT INTO users (username, email, password_hash)
    VALUES 
    ('testuser', 'testuser@example.com', '$2b$10$wN1j/G.dC/94NfXm5aAfe.YjU6ZfL3fFm/yUfH4hB2oEqB/nO2cSy')
    ON CONFLICT (username) DO NOTHING;

    -- Insert seed products
    INSERT INTO products (id, name, price, category, description)
    VALUES 
    ('p1', 'Premium Cloud Arch Shirt', 29.99, 'Apparel', 'Over-provisioned comfort'),
    ('p2', 'Kubernetes Scheduler Mug', 14.99, 'Kitchenware', 'Keeps beverages warm while pods are pending'),
    ('p3', 'Node Allocator Plushie', 24.99, 'Toys', 'Reclaims logical resources on contact'),
    ('p4', 'Autoscaler Keycap', 9.99, 'Electronics', 'Fills node capacity with a single click')
    ON CONFLICT (id) DO NOTHING;
